# Seeded by vigOS devkit — yours to edit; upgrades never overwrite this file.
# Bugs / missing tools: https://github.com/vig-os/devkit/issues

#
# Called unconditionally from the managed ci.yml as the `extension` job and
# aggregated by the CI Summary gate — a failing or cancelled job here blocks
# the merge exactly like lint/test/commit-checks. Every input is
# `required: false`: this file is a preserved, consumer-owned contract, so a
# later devkit release can add an input without breaking an existing copy.
# `runs-on` resolves from `runner-json` (the same DEVKIT_CI_RUNNER-derived
# value the rest of ci.yml uses) rather than a literal label, so a self-hosted
# consumer's own runners pick this job up too, and so actionlint keeps linting
# clean once you start editing below (it does not know every hosted label).
# See "CI Extension Hook" in docs/DOWNSTREAM_RELEASE.md.

name: CI Extension

on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      mode:
        description: "Resolved delivery mode (devcontainer/direnv/both/bare)"
        required: false
        type: string
      image:
        description: "Resolved container image (empty string in host modes)"
        required: false
        type: string
      image-tag:
        description: "Resolved devkit image tag"
        required: false
        type: string
      runner-json:
        description: "JSON array of runner labels (DEVKIT_CI_RUNNER)"
        required: false
        type: string
        default: '["ubuntu-26.04"]'

permissions:
  contents: read

jobs:
  # The flake package g-fleet consumes: build it on Linux and on Apple
  # silicon, then smoke-test exit fidelity on the built binary. macOS also
  # runs the full test suite, which covers the darwin-only paths (the `ps`
  # probe, BSD PTY behaviour) that the Linux lanes in ci.yml cannot.
  package:
    name: Package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24  # v31.11.1

      - name: Build packages.default
        run: nix build .#default -L

      - name: Smoke-test the built binary
        run: |
          ./result/bin/watcher-s1 --version
          set +e
          ./result/bin/watcher-s1 --no-s1 -q --events smoke.jsonl -- sh -c 'echo hi; exit 3'
          rc=$?
          set -e
          test "$rc" -eq 3
          grep -q '"code":3' smoke.jsonl

      - name: Test suite (macOS)
        if: runner.os == 'macOS'
        run: nix develop -c cargo test --locked
